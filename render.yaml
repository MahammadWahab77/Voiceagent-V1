services:
  # Backend Service
  - type: web
    name: voiceagent-backend
    env: node
    root: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

staticSites:
  # Frontend Static Site
  - name: voiceagent-frontend
    root: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    plan: free
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: voiceagent-backend
          property: url
